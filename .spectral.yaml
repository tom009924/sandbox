extends:
  - "spectral:oas"
  - "@stoplight/spectral-owasp-ruleset"

rules:
  # =========================================================================
  # 1. 基本規約 & 識別子 (Core & Identifiers)
  # =========================================================================
  operation-operationId: error

  # =========================================================================
  # 2. 命名規約 (Naming Conventions)
  # =========================================================================
  # Path naming convention: kebab-case
  paths-kebab-case:
    description: API path segments must be kebab-case (e.g. /api/todo-items/{id}).
    message: "Path segment in '{{property}}' must be kebab-case."
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        match: "^(\\/([a-z0-9]+(-[a-z0-9]+)*|{[a-zA-Z0-9_-]+}))+$"

  # Operation ID naming convention: camelCase
  operation-operationId-camel-case:
    description: Operation IDs must be camelCase.
    message: "operationId '{{value}}' must be camelCase."
    severity: error
    given: $.paths.*[get,post,put,delete,patch].operationId
    then:
      function: casing
      functionOptions:
        type: camel

  # Schema properties naming convention: camelCase
  properties-camel-case:
    description: Schema property names must be camelCase.
    message: "Property '{{property}}' must be camelCase."
    severity: error
    given: "$..properties.*~"
    then:
      function: casing
      functionOptions:
        type: camel

  # Path parameter naming convention: camelCase
  path-params-camel-case:
    description: Path parameter names must be camelCase.
    message: "Path parameter '{{value}}' must be camelCase."
    severity: error
    given: $.paths..parameters[?(@.in == 'path')].name
    then:
      function: casing
      functionOptions:
        type: camel

  # =========================================================================
  # 3. OWASP API Security - 有効化・推奨ルール
  # =========================================================================
  owasp:api2:2023-jwt-best-practices: error      # JWT セキュリティ標準 (RFC8725 準拠宣言)
  owasp:api3:2023-no-additionalProperties: error # 未定義プロパティの禁止 (Mass Assignment 防止)
  owasp:api4:2023-array-limit: warn              # 配列リソースの枯渇防止 (maxItems)
  owasp:api9:2023-inventory-access: error        # サーバー環境 (x-internal) の明示

  # =========================================================================
  # 4. OWASP API Security - 現フェーズでの除外・緩和ルール
  # =========================================================================
  # ローカル開発URL (http://localhost:8080) を許容
  owasp:api8:2023-no-server-http: off

  # ログイン・サインアップなど公開POSTエンドポイントに対する誤検知を回避
  owasp:api2:2023-write-restricted: off

  # レートリミットヘッダーおよび429応答（現アーキテクチャでは過剰）
  owasp:api4:2023-rate-limit: off
  owasp:api4:2023-rate-limit-responses-429: off
  owasp:api4:2023-rate-limit-retry-after: off

  # エラーレスポンス一括強制（401, 500, validation）の解除
  owasp:api8:2023-define-error-responses-401: off
  owasp:api8:2023-define-error-responses-500: off
  owasp:api8:2023-define-error-validation: off

  # スキーマの厳密制約（別ブランチで段階的に導入するため現時点では off）
  owasp:api4:2023-string-limit: off
  owasp:api4:2023-string-restricted: off
  owasp:api4:2023-integer-limit-legacy: off
  owasp:api4:2023-integer-limit: off
