spring.cloud.gcp.spanner.project-id=${SPANNER_PROJECT_ID:todo-project}
spring.cloud.gcp.spanner.instance-id=${SPANNER_INSTANCE_ID:todo-instance}
spring.cloud.gcp.spanner.database=${SPANNER_DATABASE:todo-database}
spring.cloud.gcp.spanner.emulator.enabled=true
spring.cloud.gcp.spanner.emulator-host=${SPANNER_EMULATOR_HOST:localhost:9010}

spring.datasource.driver-class-name=com.google.cloud.spanner.jdbc.JdbcDriver
spring.datasource.url=${SPANNER_JDBC_URL:jdbc:cloudspanner:/projects/todo-project/instances/todo-instance/databases/todo-database?autoConfigEmulator=true}
spring.jackson.deserialization.fail-on-null-for-primitives=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

pubsub.project-id=${PUBSUB_PROJECT_ID:todo-project}
pubsub.topic-id=${PUBSUB_TOPIC_ID:todo-events}
pubsub.emulator-host=${PUBSUB_EMULATOR_HOST:}
