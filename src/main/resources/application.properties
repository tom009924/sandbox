spring.datasource.driver-class-name=com.google.cloud.spanner.jdbc.JdbcDriver
spring.datasource.url=${SPANNER_JDBC_URL:jdbc:cloudspanner:/projects/todo-project/instances/todo-instance/databases/todo-database?autoConfigEmulator=true}
spring.jpa.database-platform=org.hibernate.dialect.SpannerDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-null-for-primitives=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

pubsub.project-id=${PUBSUB_PROJECT_ID:todo-project}
pubsub.topic-id=${PUBSUB_TOPIC_ID:todo-events}
pubsub.emulator-host=${PUBSUB_EMULATOR_HOST:}
