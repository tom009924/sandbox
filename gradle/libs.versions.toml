[versions]
kotlin = "2.2.21"
springBoot = "4.0.9"
springDependencyManagement = "1.1.7"
detekt = "1.23.8"
dependencyAnalysis = "3.19.2"
openapiGenerator = "7.10.0"
jacoco = "0.8.12"

spannerJdbc = "2.29.1"
springCloudGcp = "8.2.2"
googleCloudPubsub = "1.137.1"
archunit = "1.3.0"
swaggerParser = "2.1.25"
jjwt = "0.12.6"
restAssured = "5.5.7"
wiremock = "3.12.1"
bouncycastle = "1.80.2"

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-cloud-gcp-dependencies = { module = "com.google.cloud:spring-cloud-gcp-dependencies", version.ref = "springCloudGcp" }
spring-cloud-gcp-starter-data-spanner = { module = "com.google.cloud:spring-cloud-gcp-starter-data-spanner", version.ref = "springCloudGcp" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }

jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect" }

spanner-jdbc = { module = "com.google.cloud:google-cloud-spanner-jdbc", version.ref = "spannerJdbc" }
google-cloud-pubsub = { module = "com.google.cloud:google-cloud-pubsub", version.ref = "googleCloudPubsub" }

archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
rest-assured = { module = "io.rest-assured:rest-assured", version.ref = "restAssured" }
swagger-parser = { module = "io.swagger.parser.v3:swagger-parser-v3", version.ref = "swaggerParser" }
flyway-gcp-spanner = { module = "org.flywaydb:flyway-gcp-spanner" }
wiremock = { module = "org.wiremock:wiremock-jetty12", version.ref = "wiremock" }
wiremock-core = { module = "org.wiremock:wiremock", version.ref = "wiremock" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependencyAnalysis" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapiGenerator" }

