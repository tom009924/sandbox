openapi: 3.0.3
info:
  title: Todo API
  version: 1.0.0
  description: REST API によるTODOタスク管理サービス。
  contact:
    name: Todo API Team
    email: support@example.com
servers:
  - url: http://localhost:8080
    description: Local development server
    x-internal: true
security:
  - bearerAuth: []
tags:
  - name: Todos
    description: TODOタスクの管理
  - name: Todo Subtasks
    description: Todo subtask checklist management
  - name: Todo Comments
    description: Todo comment management
  - name: Projects
    description: プロジェクトおよびメンバーの管理
  - name: Auth
    description: ユーザー認証および登録
  - name: Settings
    description: ユーザー設定および環境設定
paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: 新規ユーザー登録
      description: 一意の認証情報を用いて新規ユーザーアカウントを登録します。
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              username: alice
              password: password123
      responses:
        '201':
          description: ユーザー登録完了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: 不正なリクエストボディ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 指定されたユーザー名は既に登録済みです
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      tags:
        - Auth
      summary: ユーザーログイン
      description: ユーザー認証情報を検証し、Bearer JWTアクセストークンを発行します。
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: alice
              password: password123
      responses:
        '200':
          description: 認証成功（トークン発行）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: 不正なリクエストボディ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: ユーザー名またはパスワードが無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/todos:
    get:
      tags:
        - Todos
      summary: TODO一覧取得
      description: 認証済みユーザーの全TODOタスク一覧を取得します。
      operationId: listTodos
      parameters:
        - name: completed
          in: query
          required: false
          description: 完了状態でTODOタスクを絞り込みます。
          schema:
            type: boolean
        - name: priority
          in: query
          required: false
          description: 優先度でTODOタスクを絞り込みます。
          schema:
            $ref: '#/components/schemas/TodoPriority'
        - name: tag
          in: query
          required: false
          description: タグでTODOタスクを絞り込みます。
          schema:
            type: string
            maxLength: 32
        - name: q
          in: query
          required: false
          description: タイトルの部分一致（大文字・小文字を区別しない）でTODOタスクを検索します。
          schema:
            type: string
            maxLength: 100
        - name: dueBefore
          in: query
          required: false
          description: 指定日以前の期限（YYYY-MM-DD）を持つTODOタスクに絞り込みます。
          schema:
            type: string
            format: date
        - name: dueAfter
          in: query
          required: false
          description: 指定日以降の期限（YYYY-MM-DD）を持つTODOタスクに絞り込みます。
          schema:
            type: string
            format: date
        - name: sortBy
          in: query
          required: false
          description: TODOタスクのソート項目を指定します。
          schema:
            $ref: '#/components/schemas/TodoSortField'
        - name: sortOrder
          in: query
          required: false
          description: ソート順を指定します（sortBy指定時のデフォルトはASC）。
          schema:
            $ref: '#/components/schemas/SortOrder'
        - name: projectId
          in: query
          required: false
          description: プロジェクトIDでTODOタスクを絞り込みます。未指定時はプロジェクトに属さない個人TODOを返します。
          schema:
            type: string
            format: uuid
        - name: assigneeId
          in: query
          required: false
          description: 担当者のユーザーIDでTODOタスクを絞り込みます。
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: TODOタスク一覧
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: '#/components/schemas/Todo'
        '401':
          description: Bearer認証トークンが不足しているか無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Todos
      summary: TODO作成
      description: 冪等性キー（Idempotency-Key）を指定して新しいTODOタスクを作成します。
      operationId: createTodo
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 大文字小文字を区別するリクエスト識別キー。同一キーかつ同一リクエスト内容の場合、24時間以内であれば最初の201レスポンスを再返却します。異なる内容でキーを再利用した場合は409 Conflictを返します。
          schema:
            type: string
            minLength: 1
            maxLength: 255
            pattern: .*\S.*
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoRequest'
            example:
              title: Buy milk
              description: Buy before the weekend
              dueDate: '2025-04-18'
              priority: HIGH
              estimatedMinutes: 30
      responses:
        '201':
          description: TODO作成完了
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: Idempotency-Keyが未指定または不正、あるいはリクエストボディが不正です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Bearer認証トークンが不足しているか無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 指定されたプロジェクトが見つからないか、メンバーではありません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 指定されたIdempotency-Keyは既に異なるリクエスト内容で使用されています
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: TODOタスクの一意識別子 (UUID)
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Todos
      summary: TODO詳細取得
      description: 指定されたIDのTODOタスクを1件取得します。
      operationId: getTodo
      responses:
        '200':
          description: TODOタスク取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '401':
          description: Bearer認証トークンが不足しているか無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 指定されたTODOタスクが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Todos
      summary: TODO更新
      description: 指定されたIDのTODOタスクを更新します。
      operationId: updateTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoRequest'
            example:
              title: Buy milk
              completed: true
              description: Purchased
              dueDate: '2025-04-18'
              priority: LOW
              estimatedMinutes: 30
      responses:
        '200':
          description: TODO更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: 不正なリクエストボディ（空白のみのタイトルなど）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Bearer認証トークンが不足しているか無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 指定されたTODOタスクが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
        - Todos
      summary: TODO部分更新
      description: 指定されたIDのTODOタスクを指定された項目のみ部分更新します。
      operationId: patchTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTodoRequest'
            example:
              completed: true
      responses:
        '200':
          description: TODO部分更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: 不正なリクエストボディ（空白のみのタイトルなど）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Bearer認証トークンが不足しているか無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 指定されたTODOタスクが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Todos
      summary: TODO削除
      description: 指定されたIDのTODOタスクを削除します。
      operationId: deleteTodo
      responses:
        '204':
          description: TODO削除完了
        '401':
          description: Bearer認証トークンが不足しているか無効です
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 指定されたTODOタスクが見つかりません
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/todos/{id}/subtasks:
    parameters:
      - name: id
        in: path
        required: true
        description: Todo identifier
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Todo Subtasks
      summary: サブタスク一覧取得
      description: Retrieve subtasks for a todo ordered by position. Accessible to the todo owner or project members.
      operationId: listTodoSubtasks
      responses:
        '200':
          description: Todo subtask list
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: '#/components/schemas/TodoSubtaskResponse'
        '401':
          description: Missing or invalid Bearer authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Todo Subtasks
      summary: サブタスク作成
      description: Add a subtask item to a todo checklist. Accessible to the todo owner or project members.
      operationId: createTodoSubtask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoSubtaskRequest'
      responses:
        '201':
          description: Subtask created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoSubtaskResponse'
        '400':
          description: Invalid subtask request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/todos/{id}/subtasks/{subtaskId}:
    parameters:
      - name: id
        in: path
        required: true
        description: Todo identifier
        schema:
          type: string
          format: uuid
      - name: subtaskId
        in: path
        required: true
        description: Subtask identifier
        schema:
          type: string
          format: uuid
    patch:
      tags:
        - Todo Subtasks
      summary: サブタスク部分更新
      description: Update title, completion status, or position of a subtask.
      operationId: patchTodoSubtask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchTodoSubtaskRequest'
      responses:
        '200':
          description: Subtask updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoSubtaskResponse'
        '400':
          description: Invalid subtask request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Todo or subtask not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Todo Subtasks
      summary: サブタスク削除
      description: Delete a subtask from a todo checklist.
      operationId: deleteTodoSubtask
      responses:
        '204':
          description: Subtask deleted
        '401':
          description: Missing or invalid Bearer authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Todo or subtask not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/todos/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        description: Todo identifier
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Todo Comments
      summary: TODOコメント一覧取得
      description: Retrieve comments for a todo ordered chronologically. Accessible to the todo owner or project members.
      operationId: listTodoComments
      responses:
        '200':
          description: Todo comment list
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: '#/components/schemas/TodoCommentResponse'
        '401':
          description: Missing or invalid Bearer authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Todo Comments
      summary: TODOコメント投稿
      description: Add a comment to a todo. Accessible to the todo owner or project members.
      operationId: createTodoComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoCommentRequest'
      responses:
        '201':
          description: Comment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodoCommentResponse'
        '400':
          description: Invalid comment request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/todos/{id}/comments/{commentId}:
    parameters:
      - name: id
        in: path
        required: true
        description: Todo identifier
        schema:
          type: string
          format: uuid
      - name: commentId
        in: path
        required: true
        description: Comment identifier
        schema:
          type: string
          format: uuid
    delete:
      tags:
        - Todo Comments
      summary: TODOコメント削除
      description: Delete a comment from a todo. Only the comment author is allowed.
      operationId: deleteTodoComment
      responses:
        '204':
          description: Comment deleted
        '401':
          description: Missing or invalid Bearer authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (only the comment author can delete)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Todo or comment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects:
    get:
      tags:
        - Projects
      summary: プロジェクト一覧取得
      description: 認証済みユーザーが所属するプロジェクトの一覧を取得します。
      operationId: listProjects
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: '#/components/schemas/ProjectResponse'
        '401':
          description: Missing or invalid Bearer authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Projects
      summary: プロジェクト作成
      description: 新しい共有プロジェクトを作成します。作成者は自動的にOWNERとして登録されます。
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
            example:
              name: Backend Migration
              description: Tasks for migrating to Spanner
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid Bearer authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        description: Project identifier
        schema:
          type: string
          format: uuid
    get:
      tags:
        - Projects
      summary: プロジェクト詳細取得
      description: Retrieve a project by its ID. Only accessible to project members.
      operationId: getProject
      responses:
        '200':
          description: Project found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          description: Missing or invalid Bearer authentication token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found or user is not a member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Projects
      summary: プロジェクト更新
      description: Update project name and description. Only project owners are allowed.
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
            example:
              name: Backend Migration Phase 2
              description: Updated scope
      responses:
        '200':
          description: Project updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
