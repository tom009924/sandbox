arazzo: 1.0.1
info:
  title: Todo API Workflows
  version: 1.0.0
  description: End-to-end user workflows and operational journeys for the Todo API.
sourceDescriptions:
  - name: publicApi
    type: openapi
    url: ../openapi.yaml
  - name: adminApi
    type: openapi
    url: ../dist/openapi.admin.yaml

workflows:
  - workflowId: user-todo-lifecycle
    summary: User registration, login, and Todo management lifecycle
    description: >
      Demonstrates registering a new user, authenticating with JWT, inspecting default settings,
      updating settings, creating an idempotent todo, fetching, updating, listing, and deleting it.
    inputs:
      type: object
      properties:
        username:
          type: string
          default: arazzo-user
        password:
          type: string
          default: Password123!
    steps:
      - stepId: registerUser
        description: Register a new end-user account
        operationId: $sourceDescriptions.publicApi.registerUser
        requestBody:
          contentType: application/json
          payload:
            username: "{$inputs.username}"
            password: "{$inputs.password}"
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          userId: $response.body#/id
          userName: $response.body#/username

      - stepId: loginUser
        description: Authenticate user credentials and acquire JWT token
        operationId: $sourceDescriptions.publicApi.loginUser
        requestBody:
          contentType: application/json
          payload:
            username: "{$steps.registerUser.outputs.userName}"
            password: "{$inputs.password}"
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          jwtToken: $response.body#/token

      - stepId: getUserSettings
        description: Fetch initial default user settings
        operationId: $sourceDescriptions.publicApi.getUserSettings
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginUser.outputs.jwtToken}"
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/defaultPriority == 'MEDIUM'

      - stepId: updateUserSettings
        description: Customize user settings for default priority and duration
        operationId: $sourceDescriptions.publicApi.updateUserSettings
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginUser.outputs.jwtToken}"
        requestBody:
          contentType: application/json
          payload:
            defaultPriority: HIGH
            defaultEstimatedMinutes: 45
            maxActiveTodos: 5
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/defaultPriority == 'HIGH'
          - condition: $response.body#/defaultEstimatedMinutes == 45
          - condition: $response.body#/maxActiveTodos == 5

      - stepId: createTodo
        description: Create a new Todo item with an idempotency key
        operationId: $sourceDescriptions.publicApi.createTodo
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginUser.outputs.jwtToken}"
          - name: Idempotency-Key
            in: header
            value: arazzo-flow-key-001
        requestBody:
          contentType: application/json
          payload:
            title: Verify Arazzo Workflow
            description: Execute end-to-end API scenario using Arazzo specification
            estimatedMinutes: 25
            priority: HIGH
        successCriteria:
          - condition: $statusCode == 201
          - condition: $response.body#/completed == false
          - condition: $response.body#/priority == 'HIGH'
        outputs:
          createdTodoId: $response.body#/id

      - stepId: getTodo
        description: Fetch the created Todo item by ID
        operationId: $sourceDescriptions.publicApi.getTodo
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginUser.outputs.jwtToken}"
          - name: id
            in: path
            value: "{$steps.createTodo.outputs.createdTodoId}"
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/title == 'Verify Arazzo Workflow'

      - stepId: updateTodo
        description: Mark the Todo item as completed
        operationId: $sourceDescriptions.publicApi.updateTodo
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginUser.outputs.jwtToken}"
          - name: id
            in: path
            value: "{$steps.createTodo.outputs.createdTodoId}"
        requestBody:
          contentType: application/json
          payload:
            title: Verify Arazzo Workflow
            completed: true
            priority: HIGH
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/completed == true

      - stepId: listTodos
        description: List all Todos for the authenticated user
        operationId: $sourceDescriptions.publicApi.listTodos
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginUser.outputs.jwtToken}"
          - name: completed
            in: query
            value: true
        successCriteria:
          - condition: $statusCode == 200

      - stepId: patchTodo
        description: Partially update the Todo priority
        operationId: $sourceDescriptions.publicApi.patchTodo
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginUser.outputs.jwtToken}"
          - name: id
            in: path
            value: "{$steps.createTodo.outputs.createdTodoId}"
        requestBody:
          contentType: application/json
          payload:
            priority: LOW
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/priority == 'LOW'

      - stepId: deleteTodo
        description: Delete the completed Todo item
        operationId: $sourceDescriptions.publicApi.deleteTodo
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginUser.outputs.jwtToken}"
          - name: id
            in: path
            value: "{$steps.createTodo.outputs.createdTodoId}"
        successCriteria:
          - condition: $statusCode == 204

  - workflowId: admin-audit-lifecycle
    summary: Administrator system audit
    description: Inspect system statistics and registered users using administrator API key.
    inputs:
      type: object
      properties:
        adminApiKey:
          type: string
          default: admin-secret-key
    steps:
      - stepId: getAdminStats
        description: Fetch system-wide usage statistics
        operationId: $sourceDescriptions.adminApi.getAdminStats
        parameters:
          - name: X-Admin-Key
            in: header
            value: "{$inputs.adminApiKey}"
        successCriteria:
          - condition: $statusCode == 200

      - stepId: getAdminUsers
        description: Fetch registered users directory
        operationId: $sourceDescriptions.adminApi.getAdminUsers
        parameters:
          - name: X-Admin-Key
            in: header
            value: "{$inputs.adminApiKey}"
        successCriteria:
          - condition: $statusCode == 200

  - workflowId: project-collaboration-lifecycle
    summary: Shared project creation, member management, and project-scoped Todo lifecycle
    description: >
      Demonstrates creating a shared project, inviting a collaborator, creating and listing
      project-scoped Todos, removing a member, and deleting the project.
    inputs:
      type: object
      properties:
        username:
          type: string
          default: arazzo-user
        password:
          type: string
          default: Password123!
    steps:
      - stepId: registerProjectOwner
        description: Register a project owner account
        operationId: $sourceDescriptions.publicApi.registerUser
        requestBody:
          contentType: application/json
          payload:
            username: "{$inputs.username}-owner"
            password: "{$inputs.password}"
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          ownerId: $response.body#/id
          ownerName: $response.body#/username

      - stepId: registerProjectMember
        description: Register a project collaborator account
        operationId: $sourceDescriptions.publicApi.registerUser
        requestBody:
          contentType: application/json
          payload:
            username: "{$inputs.username}-member"
            password: "{$inputs.password}"
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          memberId: $response.body#/id
          memberName: $response.body#/username

      - stepId: loginProjectOwner
        description: Authenticate project owner and acquire JWT token
        operationId: $sourceDescriptions.publicApi.loginUser
        requestBody:
          contentType: application/json
          payload:
            username: "{$steps.registerProjectOwner.outputs.ownerName}"
            password: "{$inputs.password}"
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          ownerToken: $response.body#/token

      - stepId: createProject
        description: Create a shared project
        operationId: $sourceDescriptions.publicApi.createProject
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginProjectOwner.outputs.ownerToken}"
        requestBody:
          contentType: application/json
          payload:
            name: Arazzo Shared Project
            description: Project created during Arazzo E2E verification
        successCriteria:
          - condition: $statusCode == 201
        outputs:
          projectId: $response.body#/id

      - stepId: listProjects
        description: List projects accessible to the owner
        operationId: $sourceDescriptions.publicApi.listProjects
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginProjectOwner.outputs.ownerToken}"
        successCriteria:
          - condition: $statusCode == 200

      - stepId: getProject
        description: Fetch project details by ID
        operationId: $sourceDescriptions.publicApi.getProject
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginProjectOwner.outputs.ownerToken}"
          - name: projectId
            in: path
            value: "{$steps.createProject.outputs.projectId}"
        successCriteria:
          - condition: $statusCode == 200

      - stepId: updateProject
        description: Update project name and description
        operationId: $sourceDescriptions.publicApi.updateProject
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginProjectOwner.outputs.ownerToken}"
          - name: projectId
            in: path
            value: "{$steps.createProject.outputs.projectId}"
        requestBody:
          contentType: application/json
          payload:
            name: Arazzo Shared Project Updated
            description: Updated during Arazzo E2E verification
        successCriteria:
          - condition: $statusCode == 200

      - stepId: addProjectMember
        description: Add collaborator to the shared project
        operationId: $sourceDescriptions.publicApi.addProjectMember
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginProjectOwner.outputs.ownerToken}"
          - name: projectId
            in: path
            value: "{$steps.createProject.outputs.projectId}"
        requestBody:
          contentType: application/json
          payload:
            username: "{$steps.registerProjectMember.outputs.memberName}"
            role: MEMBER
        successCriteria:
          - condition: $statusCode == 201

      - stepId: listProjectMembers
        description: List members of the shared project
        operationId: $sourceDescriptions.publicApi.listProjectMembers
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginProjectOwner.outputs.ownerToken}"
          - name: projectId
            in: path
            value: "{$steps.createProject.outputs.projectId}"
        successCriteria:
          - condition: $statusCode == 200

      - stepId: createProjectTodo
        description: Create a Todo scoped to the shared project
        operationId: $sourceDescriptions.publicApi.createTodo
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginProjectOwner.outputs.ownerToken}"
          - name: Idempotency-Key
            in: header
            value: arazzo-project-todo-key-001
        requestBody:
          contentType: application/json
          payload:
            title: Project Scoped Task
            projectId: "{$steps.createProject.outputs.projectId}"
        successCriteria:
          - condition: $statusCode == 201

      - stepId: listProjectTodos
        description: List Todos filtered by projectId
        operationId: $sourceDescriptions.publicApi.listTodos
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginProjectOwner.outputs.ownerToken}"
          - name: projectId
            in: query
            value: "{$steps.createProject.outputs.projectId}"
        successCriteria:
          - condition: $statusCode == 200

      - stepId: getProjectStats
        description: Fetch project Todo progress and priority statistics
        operationId: $sourceDescriptions.publicApi.getProjectStats
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginProjectOwner.outputs.ownerToken}"
          - name: projectId
            in: path
            value: "{$steps.createProject.outputs.projectId}"
        successCriteria:
          - condition: $statusCode == 200

      - stepId: removeProjectMember
        description: Remove collaborator from the shared project
        operationId: $sourceDescriptions.publicApi.removeProjectMember
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginProjectOwner.outputs.ownerToken}"
          - name: projectId
            in: path
            value: "{$steps.createProject.outputs.projectId}"
          - name: userId
            in: path
            value: "{$steps.registerProjectMember.outputs.memberId}"
        successCriteria:
          - condition: $statusCode == 204

      - stepId: deleteProject
        description: Delete the shared project
        operationId: $sourceDescriptions.publicApi.deleteProject
        parameters:
          - name: Authorization
            in: header
            value: "Bearer {$steps.loginProjectOwner.outputs.ownerToken}"
          - name: projectId
            in: path
            value: "{$steps.createProject.outputs.projectId}"
        successCriteria:
          - condition: $statusCode == 204
