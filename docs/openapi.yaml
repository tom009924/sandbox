openapi: 3.0.3
info:
  title: Todo API
  version: 1.0.0
  description: REST API for managing todos.
servers:
  - url: http://localhost:8080
    description: Local development server
tags:
  - name: Todos
    description: Todo management
paths:
  /api/todos:
    get:
      tags:
        - Todos
      summary: List todos
      operationId: listTodos
      responses:
        '200':
          description: Todo list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
    post:
      tags:
        - Todos
      summary: Create a todo
      operationId: createTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoRequest'
            example:
              title: Buy milk
      responses:
        '201':
          description: Todo created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: Invalid request body, including a blank title
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Todo identifier
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags:
        - Todos
      summary: Get a todo
      operationId: getTodo
      responses:
        '200':
          description: Todo found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Todos
      summary: Update a todo
      operationId: updateTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoRequest'
            example:
              title: Buy milk
              completed: true
      responses:
        '200':
          description: Todo updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: Invalid request body, including a blank title
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Todos
      summary: Delete a todo
      operationId: deleteTodo
      responses:
        '204':
          description: Todo deleted
        '404':
          description: Todo not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Todo:
      type: object
      required:
        - id
        - title
        - completed
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Buy milk
        completed:
          type: boolean
          example: false
    ErrorResponse:
      type: object
      additionalProperties: true
    CreateTodoRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          pattern: '\S'
          description: Must contain at least one non-whitespace character. Leading and trailing whitespace is trimmed.
          example: Buy milk
    UpdateTodoRequest:
      type: object
      required:
        - title
        - completed
      properties:
        title:
          type: string
          pattern: '\S'
          description: Must contain at least one non-whitespace character. Leading and trailing whitespace is trimmed.
          example: Buy milk
        completed:
          type: boolean
          example: true
