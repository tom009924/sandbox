openapi: 3.0.3
info:
  title: Todo API
  version: 1.0.0
  description: REST API for managing todos.
  contact:
    name: Todo API Team
    email: support@example.com
servers:
  - url: http://localhost:8080
    description: Local development server
    x-internal: true
security:
  - bearerAuth: []
tags:
  - name: Todos
    description: Todo management
  - name: Todo Subtasks
    description: Todo subtask checklist management
  - name: Todo Comments
    description: Todo comment management
  - name: Projects
    description: Project management
  - name: Auth
    description: User authentication and registration
  - name: Settings
    description: User settings and preferences
paths:
  /api/auth/register:
    $ref: paths/api_auth_register.yaml
  /api/auth/login:
    $ref: paths/api_auth_login.yaml
  /api/todos:
    $ref: paths/api_todos.yaml
  /api/todos/{id}:
    $ref: paths/api_todos_{id}.yaml
  /api/todos/{id}/subtasks:
    $ref: paths/api_todos_{id}_subtasks.yaml
  /api/todos/{id}/subtasks/{subtaskId}:
    $ref: paths/api_todos_{id}_subtasks_{subtaskId}.yaml
  /api/todos/{id}/comments:
    $ref: paths/api_todos_{id}_comments.yaml
  /api/todos/{id}/comments/{commentId}:
    $ref: paths/api_todos_{id}_comments_{commentId}.yaml
  /api/projects:
    $ref: paths/api_projects.yaml
  /api/projects/{projectId}:
    $ref: paths/api_projects_{projectId}.yaml
  /api/projects/{projectId}/members:
    $ref: paths/api_projects_{projectId}_members.yaml
  /api/projects/{projectId}/members/{userId}:
    $ref: paths/api_projects_{projectId}_members_{userId}.yaml
  /api/user/settings:
    $ref: paths/api_user_settings.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT Bearer token obtained from /api/auth/login. JWTs should comply with
        RFC8725.
