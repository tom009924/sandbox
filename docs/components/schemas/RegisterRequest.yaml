type: object
required:
  - username
  - password
properties:
  username:
    type: string
    pattern: .*\S.*
    minLength: 3
    maxLength: 50
    description: Unique username for the account.
    example: alice
  password:
    type: string
    pattern: .*\S.*
    minLength: 6
    maxLength: 100
    description: Password for the account.
    example: password123
additionalProperties: false
