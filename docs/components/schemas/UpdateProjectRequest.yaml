type: object
additionalProperties: false
required:
  - name
properties:
  name:
    type: string
    maxLength: 100
    pattern: .*\S.*
    description: Project name. Must contain at least one non-whitespace character.
    example: Backend Migration Phase 2
  description:
    type: string
    maxLength: 500
    nullable: true
    example: Updated scope
    pattern: ^[\s\S]*$
