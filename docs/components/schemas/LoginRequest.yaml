type: object
required:
  - username
  - password
properties:
  username:
    type: string
    description: Username of the registered account.
    example: alice
    maxLength: 255
    pattern: ^\S+$
  password:
    type: string
    description: Password of the account.
    example: password123
    maxLength: 255
    format: password
additionalProperties: false
