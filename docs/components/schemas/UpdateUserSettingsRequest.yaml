type: object
required:
  - defaultPriority
properties:
  defaultPriority:
    $ref: ./TodoPriority.yaml
  defaultEstimatedMinutes:
    type: integer
    format: int32
    nullable: true
    minimum: 0
    description: Default estimated duration in minutes applied when not specified.
    example: 30
    maximum: 2147483647
  maxActiveTodos:
    type: integer
    format: int32
    nullable: true
    minimum: 1
    description: Maximum number of active (uncompleted) todos allowed.
    example: 10
    maximum: 2147483647
additionalProperties: false
