get:
  tags:
    - Projects
  summary: List projects
  description: Retrieve a list of projects that the authenticated user is a member of.
  operationId: listProjects
  responses:
    "200":
      description: Project list
      content:
        application/json:
          schema:
            type: array
            maxItems: 1000
            items:
              $ref: ../components/schemas/ProjectResponse.yaml
    "401":
      description: Missing or invalid Bearer authentication token
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
post:
  tags:
    - Projects
  summary: Create a project
  description: Create a new shared project. The creator is automatically registered as OWNER.
  operationId: createProject
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateProjectRequest.yaml
        example:
          name: Backend Migration
          description: Tasks for migrating to Spanner
  responses:
    "201":
      description: Project created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ProjectResponse.yaml
    "400":
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    "401":
      description: Missing or invalid Bearer authentication token
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
