post:
  tags:
    - Auth
  summary: Log in user
  description: Authenticate user credentials and return a Bearer JWT access token.
  operationId: loginUser
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/LoginRequest.yaml
        example:
          username: alice
          password: password123
  responses:
    "200":
      description: Authentication successful
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AuthTokenResponse.yaml
    "400":
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    "401":
      description: Invalid username or password
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
