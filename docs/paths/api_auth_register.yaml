post:
  tags:
    - Auth
  summary: Register a new user
  description: Register a new user account with unique credentials.
  operationId: registerUser
  security: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/RegisterRequest.yaml
        example:
          username: alice
          password: password123
  responses:
    '201':
      description: User registered successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UserResponse.yaml
    '400':
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '409':
      description: Username is already registered
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
