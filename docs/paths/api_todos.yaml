get:
  tags:
    - Todos
  summary: List todos
  description: Retrieve a list of all todos for the authenticated user.
  operationId: listTodos
  parameters:
    - name: completed
      in: query
      required: false
      description: Filter todos by completion status.
      schema:
        type: boolean
    - name: priority
      in: query
      required: false
      description: Filter todos by priority.
      schema:
        $ref: ../components/schemas/TodoPriority.yaml
    - name: tag
      in: query
      required: false
      description: Filter todos by tag.
      schema:
        type: string
        maxLength: 32
    - name: q
      in: query
      required: false
      description: Filter todos by case-insensitive substring match on title.
      schema:
        type: string
        maxLength: 100
    - name: dueBefore
      in: query
      required: false
      description: Filter todos with a due date on or before this date (YYYY-MM-DD).
      schema:
        type: string
        format: date
    - name: dueAfter
      in: query
      required: false
      description: Filter todos with a due date on or after this date (YYYY-MM-DD).
      schema:
        type: string
        format: date
    - name: sortBy
      in: query
      required: false
      description: Field to sort todos by.
      schema:
        $ref: ../components/schemas/TodoSortField.yaml
    - name: sortOrder
      in: query
      required: false
      description: Sort direction (defaults to ASC when sortBy is specified).
      schema:
        $ref: ../components/schemas/SortOrder.yaml
    - name: projectId
      in: query
      required: false
      description: >-
        Filter todos by project ID. When omitted, returns personal todos not
        belonging to any project.
      schema:
        type: string
        format: uuid
    - name: assigneeId
      in: query
      required: false
      description: Filter todos by assignee user ID.
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: Todo list
      content:
        application/json:
          schema:
            type: array
            maxItems: 1000
            items:
              $ref: ../components/schemas/Todo.yaml
    '401':
      description: Missing or invalid Bearer authentication token
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
post:
  tags:
    - Todos
  summary: Create a todo
  description: Create a new todo item with an idempotency key.
  operationId: createTodo
  parameters:
    - name: Idempotency-Key
      in: header
      required: true
      description: >-
        Case-sensitive request key, unique across this API. The same key and
        identical request replays the original 201 response for 24 hours.
        Reusing the key with a different request returns 409 Conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: .*\S.*
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateTodoRequest.yaml
        example:
          title: Buy milk
          description: Buy before the weekend
          dueDate: '2025-04-18'
          priority: HIGH
          estimatedMinutes: 30
  responses:
    '201':
      description: Todo created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Todo.yaml
    '400':
      description: Missing or invalid Idempotency-Key or invalid request body
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '401':
      description: Missing or invalid Bearer authentication token
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '404':
      description: Specified project not found or user is not a member
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '409':
      description: Idempotency-Key was already used with a different request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
