parameters:
  - name: id
    in: path
    required: true
    description: Todo identifier
    schema:
      type: string
      format: uuid
      maxLength: 36
get:
  tags:
    - Todo Comments
  summary: List comments for a todo
  description: Retrieve comments for a todo ordered chronologically. Accessible to the todo owner or project members.
  operationId: listTodoComments
  responses:
    "200":
      description: Todo comment list
      content:
        application/json:
          schema:
            type: array
            maxItems: 1000
            items:
              $ref: ../components/schemas/TodoCommentResponse.yaml
    "401":
      description: Missing or invalid Bearer authentication token
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    "404":
      description: Todo not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
post:
  tags:
    - Todo Comments
  summary: Add a comment to a todo
  description: Add a comment to a todo. Accessible to the todo owner or project members.
  operationId: createTodoComment
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateTodoCommentRequest.yaml
  responses:
    "201":
      description: Comment created
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TodoCommentResponse.yaml
    "400":
      description: Invalid comment request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    "401":
      description: Missing or invalid Bearer authentication token
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    "404":
      description: Todo not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
