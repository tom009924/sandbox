get:
  tags:
    - Settings
  summary: Get user settings
  description: >-
    Retrieve settings and preferences for the authenticated user. If no settings
    exist yet, returns default settings.
  operationId: getUserSettings
  responses:
    '200':
      description: User settings retrieved successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UserSettingsResponse.yaml
    '401':
      description: Bearer authentication token is missing or invalid
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
put:
  tags:
    - Settings
  summary: Update user settings
  description: Update settings and preferences for the authenticated user.
  operationId: updateUserSettings
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateUserSettingsRequest.yaml
        example:
          defaultPriority: HIGH
          defaultEstimatedMinutes: 45
          maxActiveTodos: 10
  responses:
    '200':
      description: User settings updated successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UserSettingsResponse.yaml
    '400':
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
    '401':
      description: Bearer authentication token is missing or invalid
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
        application/problem+json:
          schema:
            $ref: ../components/schemas/ErrorResponse.yaml
