server.port=${SERVER_PORT:8082}

spring.application.name=api-gateway
spring.jackson.deserialization.fail-on-null-for-primitives=true

gateway.identity.grpc-host=${IDENTITY_GRPC_HOST:localhost}
gateway.identity.grpc-port=${IDENTITY_GRPC_PORT:9091}
gateway.identity.internal-api-key=${IDENTITY_INTERNAL_API_KEY:internal-secret-key}
gateway.identity.timeout=${IDENTITY_GRPC_TIMEOUT:5s}
gateway.identity.use-tls=${IDENTITY_GRPC_USE_TLS:false}

gateway.todo.grpc-host=${TODO_GRPC_HOST:localhost}
gateway.todo.grpc-port=${TODO_GRPC_PORT:9092}
gateway.todo.internal-api-key=${TODO_INTERNAL_API_KEY:internal-secret-key}
gateway.todo.timeout=${TODO_GRPC_TIMEOUT:10s}
gateway.todo.use-tls=${TODO_GRPC_USE_TLS:false}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.export.enabled=${OTEL_EXPORTER_OTLP_ENABLED:false}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging.pattern.level=%5p [${spring.application.name:api-gateway},%X{traceId:-},%X{spanId:-}]
