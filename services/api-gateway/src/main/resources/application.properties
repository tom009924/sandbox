server.port=${SERVER_PORT:8082}

spring.application.name=api-gateway
spring.jackson.deserialization.fail-on-null-for-primitives=true

gateway.identity.grpc-host=${IDENTITY_GRPC_HOST:localhost}
gateway.identity.grpc-port=${IDENTITY_GRPC_PORT:9091}
gateway.identity.internal-api-key=${IDENTITY_INTERNAL_API_KEY:internal-secret-key}
gateway.identity.timeout=${IDENTITY_GRPC_TIMEOUT:5s}

gateway.todo-service.base-url=${TODO_SERVICE_BASE_URL:http://localhost:8080}
gateway.todo-service.timeout=${TODO_SERVICE_TIMEOUT:10s}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
logging.pattern.level=%5p [${spring.application.name:api-gateway},%X{traceId:-},%X{spanId:-}]
