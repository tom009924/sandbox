server.port=${SERVER_PORT:8081}

spring.cloud.gcp.spanner.project-id=${SPANNER_PROJECT_ID:todo-project}
spring.cloud.gcp.spanner.instance-id=${SPANNER_INSTANCE_ID:todo-instance}
spring.cloud.gcp.spanner.database=${SPANNER_DATABASE:identity-database}
spring.cloud.gcp.spanner.emulator.enabled=${SPANNER_EMULATOR_ENABLED:true}
spring.cloud.gcp.spanner.emulator-host=${SPANNER_EMULATOR_HOST:localhost:9010}

identity.security.internal-api-key=${IDENTITY_INTERNAL_API_KEY:internal-secret-key}
identity.grpc.enabled=${IDENTITY_GRPC_ENABLED:true}
identity.grpc.port=${GRPC_SERVER_PORT:9091}

spring.datasource.driver-class-name=com.google.cloud.spanner.jdbc.JdbcDriver
spring.datasource.url=${SPANNER_JDBC_URL:jdbc:cloudspanner:/projects/todo-project/instances/todo-instance/databases/identity-database?autoConfigEmulator=true}
spring.jackson.deserialization.fail-on-null-for-primitives=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${OTEL_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.export.enabled=${OTEL_EXPORTER_OTLP_ENABLED:false}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
spring.application.name=identity-service
logging.pattern.level=%5p [${spring.application.name:identity-service},%X{traceId:-},%X{spanId:-}]
