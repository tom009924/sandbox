name: OpenAPI Docs Artifact

on:
  push:
    branches: [main]
    paths:
      - "docs/openapi.yaml"
      - "docs/paths/**"
      - "docs/components/**"
      - "docs/overlays/**"
      - "redocly.yaml"
      - "package.json"
      - ".github/workflows/openapi-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/openapi.yaml"
      - "docs/paths/**"
      - "docs/components/**"
      - "docs/overlays/**"
      - "redocly.yaml"
      - "package.json"
      - ".github/workflows/openapi-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openapi-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-openapi-docs:
    name: Build OpenAPI HTML Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Build OpenAPI HTML documentation
        run: npm run build:docs

      - name: Upload OpenAPI HTML docs artifact
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: openapi-docs-html
          path: build/docs/*.html
          if-no-files-found: error
          retention-days: 7
