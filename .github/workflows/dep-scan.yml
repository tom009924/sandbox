name: OWASP dep-scan (Reachability & VEX)

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/build.gradle.kts"
      - "build.gradle.kts"
      - "gradle/libs.versions.toml"
      - "**/gradle.lockfile"
      - "gradle.lockfile"
      - "package.json"
      - "package-lock.json"
      - "scripts/dep-scan.sh"
      - ".github/workflows/dep-scan.yml"
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dep-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dep-scan:
    name: OWASP dep-scan Reachability & VEX Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      packages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom --no-daemon

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OWASP dep-scan
        run: python -m pip install --upgrade owasp-depscan

      - name: Compute weekly cache key
        id: cache-key
        run: echo "week=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache OWASP dep-scan app-only VDB
        uses: actions/cache@v4
        with:
          path: /tmp/depscan-vdb
          key: depscan-vdb-app-${{ steps.cache-key.outputs.week }}
          restore-keys: |
            depscan-vdb-app-

      - name: Download app-only Vulnerability DB
        env:
          VDB_HOME: /tmp/depscan-vdb
        run: |
          mkdir -p /tmp/depscan-vdb
          if [ ! -f /tmp/depscan-vdb/data.vdb6 ] && [ ! -f /tmp/depscan-vdb/data.vdb5 ]; then
            depscan-vdb download --scope app
          fi
          depscan-vdb info || true

      - name: Run OWASP dep-scan on CycloneDX SBOM (EPSS/KEV & VEX)
        env:
          VDB_HOME: /tmp/depscan-vdb
        run: |
          mkdir -p build/reports/depscan
          depscan \
            --bom build/reports/cyclonedx/bom.json \
            --reports-dir build/reports/depscan \
            --explain \
            --profile appsec || true

      - name: Summarize OWASP dep-scan reports in Job Summary
        if: always()
        run: |
          echo "### 🔍 OWASP dep-scan (EPSS/KEV & VEX Analysis)" >> $GITHUB_STEP_SUMMARY
          if compgen -G "build/reports/depscan/*.txt" > /dev/null; then
            for report in build/reports/depscan/*.txt; do
              echo "#### $(basename "$report")" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              cat "$report" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "Generated VEX / CycloneDX BOM and SARIF reports in \`build/reports/depscan/\`." >> $GITHUB_STEP_SUMMARY
            ls -la build/reports/depscan/ || true
          fi

      - name: Upload OWASP dep-scan VEX, BOM & SARIF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-depscan-reports
          path: build/reports/depscan/
          if-no-files-found: ignore
          retention-days: 14
