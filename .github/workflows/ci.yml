name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:latest
        ports:
          - 9010:9010
      pubsub-emulator:
        image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
        command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
        ports:
          - 8085:8085
      apigee-emulator:
        image: gcr.io/apigee-release/hybrid/apigee-emulator:public-image-2.0.2
        ports:
          - 8088:8080
          - 8998:8998
        env:
          APIGEE_ORG: hybrid
          APIGEE_ENV: test
          LISTEN_ADDRESS: 0.0.0.0
        options: --add-host=host.docker.internal:host-gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run checks and build application JAR
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
          PUBSUB_EMULATOR_HOST: localhost:8085
          PUBSUB_REQUIRED: "true"
        run: ./gradlew check :libs:identity-proto:check :services:identity-service:check :services:api-gateway:check bootJar :services:identity-service:bootJar :services:api-gateway:bootJar --no-daemon -PdetektAutoCorrect=false

      - name: Generate CycloneDX SBOM
        run: ./gradlew cyclonedxBom --no-daemon

      - name: Upload CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-cyclonedx-sbom
          path: build/reports/cyclonedx/bom.json
          retention-days: 14

      - name: Verify generated docs and diagrams are up-to-date
        run: |
          ./gradlew generateExternalCallDiagrams --no-daemon
          git diff --exit-code docs/dist docs/workflows/README.md docs/architecture/external-call-sequence.md

      - name: Run Arazzo E2E workflow tests
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
          PUBSUB_EMULATOR_HOST: localhost:8085
        run: |
          java -jar build/libs/app.jar > app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          echo "Started application with PID $APP_PID"

          echo "Waiting for application to become healthy..."
          READY=0
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/auth/register || true)
            if [ "$HTTP_CODE" != "000" ] && [ -n "$HTTP_CODE" ]; then
              echo "Application is ready! (HTTP $HTTP_CODE)"
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Application failed to start within timeout. Logs:"
            cat app.log
            exit 1
          fi

          npm run test:arazzo

      - name: Run combined microservices E2E test
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
          PUBSUB_EMULATOR_HOST: localhost:8085
        run: |
          SPANNER_DATABASE=identity-database \
          java -jar services/identity-service/build/libs/app.jar > identity-service.log 2>&1 &
          IDENTITY_PID=$!
          trap 'kill "$IDENTITY_PID" "${TODO_PID:-}" "${GATEWAY_PID:-}" 2>/dev/null || true' EXIT

          IDENTITY_READY=0
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081/actuator/health || true)
            if [ "$HTTP_CODE" = "200" ]; then
              IDENTITY_READY=1
              break
            fi
            sleep 2
          done

          if [ "$IDENTITY_READY" -ne 1 ]; then
            echo "identity-service failed to become healthy. Logs:"
            cat identity-service.log
            exit 1
          fi

          IDENTITY_SERVICE_ENABLED=true \
          IDENTITY_SERVICE_BASE_URL=http://127.0.0.1:8081 \
          java -jar build/libs/app.jar > todo-api.log 2>&1 &
          TODO_PID=$!

          TODO_READY=0
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/actuator/health || true)
            if [ "$HTTP_CODE" = "200" ]; then
              TODO_READY=1
              break
            fi
            sleep 2
          done

          if [ "$TODO_READY" -ne 1 ]; then
            echo "todo-api failed to become healthy. Logs:"
            cat todo-api.log
            exit 1
          fi

          IDENTITY_GRPC_HOST=127.0.0.1 \
          IDENTITY_GRPC_PORT=9091 \
          TODO_SERVICE_BASE_URL=http://127.0.0.1:8080 \
          java -jar services/api-gateway/build/libs/app.jar > api-gateway.log 2>&1 &
          GATEWAY_PID=$!

          GATEWAY_READY=0
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8082/actuator/health || true)
            if [ "$HTTP_CODE" = "200" ]; then
              GATEWAY_READY=1
              break
            fi
            sleep 2
          done

          if [ "$GATEWAY_READY" -ne 1 ]; then
            echo "api-gateway failed to become healthy. Logs:"
            cat api-gateway.log
            exit 1
          fi

          if ! GATEWAY_BASE_URL=http://127.0.0.1:8082 node scripts/test-microservices-e2e.mjs; then
            echo "Combined microservices E2E test failed. identity-service.log:"
            cat identity-service.log
            echo "todo-api.log:"
            cat todo-api.log
            echo "api-gateway.log:"
            cat api-gateway.log
            exit 1
          fi
