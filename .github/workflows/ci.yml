name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "docs/adr/**"
      - "docs/testing/**"
      - "docs/architecture/microservices.md"
      - ".github/copilot-instructions.md"
      - ".github/rules/**"
      - ".github/skills/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx2g"

jobs:
  lint-and-specs:
    name: Lint, Specs, Libs & Build Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Detekt, API spec linters, library checks, and Dependency Analysis
        run: |
          ./gradlew :detekt :lintOpenApi :lintAsyncApi :services:todo-service:openApiValidate :libs:grpc-common:check :buildHealth \
            --no-daemon -PdetektAutoCorrect=false

      - name: Verify generated OpenAPI and workflow docs are up-to-date
        run: git diff --exit-code docs/dist docs/workflows/README.md

  dead-code-check:
    name: Production Dead Code Check (ASM)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile production classes
        run: |
          ./gradlew \
            :libs:grpc-common:classes \
            :libs:identity-proto:classes \
            :libs:todo-proto:classes \
            :services:api-gateway:classes \
            :services:identity-service:classes \
            :services:project-service:classes \
            :services:spanner-proxy:classes \
            :services:todo-service:classes \
            --no-daemon

      - name: Run ASM dead-code analyzer against baseline
        run: |
          set -o pipefail
          {
            echo "## Production Dead Code Check (ASM)"
            echo '```text'
          } >> "$GITHUB_STEP_SUMMARY"
          ./gradlew -p tools/dead-code-analyzer run --no-daemon -q \
            --args="$(pwd) --baseline $(pwd)/tools/dead-code-analyzer/baseline.txt" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  verify-spanner-services:
    name: Verify ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:latest
        ports:
          - 9010:9010
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: todo-service
            gradle-project: :services:todo-service
            extra-tasks: ":services:todo-service:persistenceIntegrationTest :services:todo-service:generateExternalCallDiagrams :services:spanner-proxy:check :services:spanner-proxy:bootJar"
            extra-exclude: -x openApiValidate
            jar-artifact: jar-todo-api
          - service: identity-service
            gradle-project: :services:identity-service
            extra-tasks: ":services:identity-service:persistenceIntegrationTest"
            extra-exclude: ""
            jar-artifact: jar-identity-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        if: matrix.service == 'todo-service'
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Node dependencies
        if: matrix.service == 'todo-service'
        run: npm ci

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit and persistence tests, coverage, build JARs, and generate SBOM
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
        run: |
          ./gradlew ${{ matrix.extra-tasks }} ${{ matrix.gradle-project }}:check ${{ matrix.gradle-project }}:bootJar ${{ matrix.gradle-project }}:cyclonedxBom \
            -x detekt ${{ matrix.extra-exclude }} \
            --no-daemon -PdetektAutoCorrect=false

      - name: Verify external call sequence diagram is up-to-date
        if: matrix.service == 'todo-service'
        run: git diff --exit-code docs/architecture/external-call-sequence.md

      - name: Upload ${{ matrix.service }} CycloneDX SBOM
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: gradle-cyclonedx-sbom-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/cyclonedx/bom.json
          retention-days: 3

      - name: Upload ${{ matrix.service }} JAR
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.jar-artifact }}
          path: services/${{ matrix.service }}/build/libs/app.jar
          retention-days: 1

      - name: Upload spanner-proxy JAR
        if: matrix.service == 'todo-service'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: jar-spanner-proxy
          path: services/spanner-proxy/build/libs/app.jar
          retention-days: 1

  verify-stateless-services:
    name: Verify ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            gradle-project: :services:api-gateway
            upload-jar: true
          - service: project-service
            gradle-project: :services:project-service
            upload-jar: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests, build JAR, and generate SBOM
        run: |
          ./gradlew ${{ matrix.gradle-project }}:check ${{ matrix.gradle-project }}:bootJar ${{ matrix.gradle-project }}:cyclonedxBom \
            -x detekt --no-daemon -PdetektAutoCorrect=false

      - name: Upload ${{ matrix.service }} CycloneDX SBOM
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: gradle-cyclonedx-sbom-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/cyclonedx/bom.json
          retention-days: 3

      - name: Upload ${{ matrix.service }} JAR
        if: matrix.upload-jar
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/libs/app.jar
          retention-days: 1

  container-integration-tests:
    name: Container Integration Tests
    needs: [verify-spanner-services, verify-stateless-services]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download service JARs
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: jar-*
          path: .ci-jars

      - name: Place service JARs for Docker builds
        run: |
          if [ -f .ci-jars/jar-identity-service/app.jar ] && [ -f .ci-jars/jar-todo-api/app.jar ] && [ -f .ci-jars/jar-api-gateway/app.jar ]; then
            mkdir -p services/identity-service/build/libs services/todo-service/build/libs services/api-gateway/build/libs
            cp .ci-jars/jar-identity-service/app.jar services/identity-service/build/libs/app.jar
            cp .ci-jars/jar-todo-api/app.jar services/todo-service/build/libs/app.jar
            cp .ci-jars/jar-api-gateway/app.jar services/api-gateway/build/libs/app.jar
            if [ -f .ci-jars/jar-spanner-proxy/app.jar ]; then
              mkdir -p services/spanner-proxy/build/libs
              cp .ci-jars/jar-spanner-proxy/app.jar services/spanner-proxy/build/libs/app.jar
            fi
            echo "SKIP_BOOT_JAR=true" >> "$GITHUB_ENV"
          else
            echo "Service JAR artifacts unavailable; falling back to local bootJar build."
            echo "SKIP_BOOT_JAR=false" >> "$GITHUB_ENV"
          fi

      - name: Run container-backed integration tests
        env:
          ENABLE_APIGEE: "true"
        run: bash scripts/run-container-integration-tests.sh
