name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Start Spanner Emulator and SQL-aware gRPC proxy
        run: |
          docker compose up -d
          for attempt in $(seq 1 60); do
            if curl --silent --output /dev/null --max-time 2 http://localhost:8474/healthz \
              && curl --silent --output /dev/null --max-time 2 http://localhost:9020; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://localhost:8474/healthz > /dev/null
          curl --silent --output /dev/null --max-time 2 http://localhost:9020

      - name: Run checks
        env:
          SPANNER_EMULATOR_HOST: localhost:8666
          SPANNER_PROXY_CONTROL_URL: http://localhost:8474
        run: ./gradlew check --no-daemon
