name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:latest
        ports:
          - 9010:9010
      pubsub-emulator:
        image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
        command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
        ports:
          - 8085:8085
      apigee-emulator:
        image: gcr.io/apigee-release/hybrid/apigee-emulator:public-image-2.0.2
        ports:
          - 8088:8080
          - 8998:8998
        env:
          APIGEE_ORG: hybrid
          APIGEE_ENV: test
          LISTEN_ADDRESS: 0.0.0.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run checks and build application JAR
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
          PUBSUB_EMULATOR_HOST: localhost:8085
        run: ./gradlew check bootJar --no-daemon

      - name: Run Arazzo E2E workflow tests
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
          PUBSUB_EMULATOR_HOST: localhost:8085
        run: |
          java -jar build/libs/app.jar > app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          echo "Started application with PID $APP_PID"

          echo "Waiting for application to become healthy..."
          READY=0
          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/auth/register || true)
            if [ "$HTTP_CODE" != "000" ] && [ -n "$HTTP_CODE" ]; then
              echo "Application is ready! (HTTP $HTTP_CODE)"
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Application failed to start within timeout. Logs:"
            cat app.log
            exit 1
          fi

          npm run test:arazzo
