name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "README.md"
      - "AGENTS.md"
      - "docs/adr/**"
      - "docs/testing/**"
      - "docs/architecture/microservices.md"
      - ".github/copilot-instructions.md"
      - ".github/rules/**"
      - ".github/skills/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx2g"

jobs:
  lint-and-specs:
    name: Lint, Specs & Build Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Detekt, API spec linters, and Dependency Analysis
        run: |
          ./gradlew :detekt :lintOpenApi :lintAsyncApi :services:todo-service:openApiValidate :buildHealth \
            --no-daemon -PdetektAutoCorrect=false

      - name: Verify generated OpenAPI and workflow docs are up-to-date
        run: git diff --exit-code docs/dist docs/workflows/README.md

  verify-monolith:
    name: Verify todo-service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests, coverage, build JAR, and generate SBOM
        run: |
          ./gradlew :services:todo-service:check :services:todo-service:bootJar :services:todo-service:cyclonedxBom \
            -x detekt -x openApiValidate \
            --no-daemon -PdetektAutoCorrect=false

      - name: Verify external call sequence diagram is up-to-date
        run: |
          ./gradlew :services:todo-service:generateExternalCallDiagrams --no-daemon
          git diff --exit-code docs/architecture/external-call-sequence.md

      - name: Upload CycloneDX SBOM
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gradle-cyclonedx-sbom
          path: services/todo-service/build/reports/cyclonedx/bom.json
          retention-days: 3

      - name: Upload todo-service JAR
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jar-todo-api
          path: services/todo-service/build/libs/app.jar
          retention-days: 1

  verify-microservices:
    name: Verify ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity-service
            gradle-project: :services:identity-service
            jar-path: services/identity-service/build/libs/app.jar
          - service: api-gateway
            gradle-project: :services:api-gateway
            jar-path: services/api-gateway/build/libs/app.jar
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests, build JAR, and generate SBOM
        run: ./gradlew ${{ matrix.gradle-project }}:check ${{ matrix.gradle-project }}:bootJar ${{ matrix.gradle-project }}:cyclonedxBom -x detekt --no-daemon -PdetektAutoCorrect=false

      - name: Upload ${{ matrix.service }} CycloneDX SBOM
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gradle-cyclonedx-sbom-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/cyclonedx/bom.json
          retention-days: 3

      - name: Upload ${{ matrix.service }} JAR
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: ${{ matrix.jar-path }}
          retention-days: 1

  container-integration-tests:
    name: Container Integration Tests
    needs: [verify-monolith, verify-microservices]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download service JARs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: .ci-jars

      - name: Place service JARs for Docker builds
        run: |
          if [ -f .ci-jars/jar-identity-service/app.jar ] && [ -f .ci-jars/jar-todo-api/app.jar ] && [ -f .ci-jars/jar-api-gateway/app.jar ]; then
            mkdir -p services/identity-service/build/libs services/todo-service/build/libs services/api-gateway/build/libs
            cp .ci-jars/jar-identity-service/app.jar services/identity-service/build/libs/app.jar
            cp .ci-jars/jar-todo-api/app.jar services/todo-service/build/libs/app.jar
            cp .ci-jars/jar-api-gateway/app.jar services/api-gateway/build/libs/app.jar
            echo "SKIP_BOOT_JAR=true" >> "$GITHUB_ENV"
          else
            echo "Service JAR artifacts unavailable; falling back to local bootJar build."
            echo "SKIP_BOOT_JAR=false" >> "$GITHUB_ENV"
          fi

      - name: Run container-backed integration tests
        run: bash scripts/run-container-integration-tests.sh
