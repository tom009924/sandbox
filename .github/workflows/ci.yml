name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-monolith:
    name: Verify todo-api (Monolith)
    runs-on: ubuntu-latest
    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:latest
        ports:
          - 9010:9010
      pubsub-emulator:
        image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
        command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
        ports:
          - 8085:8085
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run checks, build JAR, and generate SBOM
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
          PUBSUB_EMULATOR_HOST: localhost:8085
          PUBSUB_REQUIRED: "true"
        run: ./gradlew :services:todo-service:check :services:todo-service:bootJar :services:todo-service:cyclonedxBom lintOpenApi lintAsyncApi buildHealth --no-daemon -PdetektAutoCorrect=false

      - name: Verify generated docs and diagrams are up-to-date
        run: |
          ./gradlew :services:todo-service:generateExternalCallDiagrams --no-daemon
          git diff --exit-code docs/dist docs/workflows/README.md docs/architecture/external-call-sequence.md

      - name: Upload CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-cyclonedx-sbom
          path: services/todo-service/build/reports/cyclonedx/bom.json
          retention-days: 14

      - name: Upload todo-api JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-todo-api
          path: services/todo-service/build/libs/app.jar
          retention-days: 1

  verify-microservices:
    name: Verify ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity-service
            gradle-project: :services:identity-service
            jar-path: services/identity-service/build/libs/app.jar
          - service: api-gateway
            gradle-project: :services:api-gateway
            jar-path: services/api-gateway/build/libs/app.jar
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run checks, build JAR, and generate SBOM
        run: ./gradlew ${{ matrix.gradle-project }}:check ${{ matrix.gradle-project }}:bootJar ${{ matrix.gradle-project }}:cyclonedxBom --no-daemon -PdetektAutoCorrect=false

      - name: Upload ${{ matrix.service }} CycloneDX SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-cyclonedx-sbom-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/reports/cyclonedx/bom.json
          retention-days: 14

      - name: Upload ${{ matrix.service }} JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: ${{ matrix.jar-path }}
          retention-days: 1

  e2e-arazzo:
    name: E2E (Arazzo Workflows)
    needs: [verify-monolith]
    runs-on: ubuntu-latest
    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:latest
        ports:
          - 9010:9010
      pubsub-emulator:
        image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
        command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
        ports:
          - 8085:8085
      apigee-emulator:
        image: gcr.io/apigee-release/hybrid/apigee-emulator:public-image-2.0.2
        ports:
          - 8088:8080
          - 8998:8998
        env:
          APIGEE_ORG: hybrid
          APIGEE_ENV: test
          LISTEN_ADDRESS: 0.0.0.0
        options: --add-host=host.docker.internal:host-gateway
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Download todo-api JAR
        uses: actions/download-artifact@v4
        with:
          name: jar-todo-api
          path: build/libs

      - name: Run Arazzo E2E workflow tests
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
          PUBSUB_EMULATOR_HOST: localhost:8085
        run: |
          java -jar build/libs/app.jar > app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          READY=0
          for _ in $(seq 1 30); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/actuator/health || true)
            if [ "$HTTP_CODE" = "200" ]; then
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "todo-api failed to become healthy. Logs:"
            cat app.log
            exit 1
          fi

          if ! npm run test:arazzo; then
            echo "Arazzo E2E failed. Logs:"
            cat app.log
            exit 1
          fi

  e2e-microservices:
    name: E2E (Gateway + Microservices)
    needs: [verify-monolith, verify-microservices]
    runs-on: ubuntu-latest
    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:latest
        ports:
          - 9010:9010
      pubsub-emulator:
        image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
        command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
        ports:
          - 8085:8085
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Download service JARs
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: .ci-jars

      - name: Run combined microservices E2E test
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
          PUBSUB_EMULATOR_HOST: localhost:8085
          IDENTITY_JAR: .ci-jars/jar-identity-service/app.jar
          TODO_JAR: .ci-jars/jar-todo-api/app.jar
          GATEWAY_JAR: .ci-jars/jar-api-gateway/app.jar
        run: bash scripts/run-microservices-e2e.sh
