name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      spanner-emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:latest
        ports:
          - 9010:9010
      pubsub-emulator:
        image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
        command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085
        ports:
          - 8085:8085
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run checks
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
          PUBSUB_EMULATOR_HOST: localhost:8085
        run: ./gradlew check --no-daemon

      - name: Build application JAR
        run: ./gradlew bootJar --no-daemon

      - name: Run Arazzo E2E workflow tests
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
          PUBSUB_EMULATOR_HOST: localhost:8085
        run: |
          java -jar build/libs/app.jar > app.log 2>&1 &
          APP_PID=$!
          echo "Started application with PID $APP_PID"

          echo "Waiting for application to become healthy..."
          READY=0
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:8080/actuator/health > /dev/null; then
              echo "Application is healthy!"
              READY=1
              break
            fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "Application failed to start within timeout. Logs:"
            cat app.log
            kill "$APP_PID" 2>/dev/null || true
            exit 1
          fi

          npm run test:arazzo
          kill "$APP_PID" 2>/dev/null || true
