name: Qodana Code Quality

on:
  workflow_dispatch:
  # NOTE: Temporarily disabled automatic triggers on pull_request and push due to execution time overhead.
  # Can be triggered manually via workflow_dispatch when needed.
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - "src/**"
  #     - "build.gradle.kts"
  #     - "settings.gradle.kts"
  #     - "gradle/**"
  #     - "docs/openapi.yaml"
  #     - "docs/overlays/**"
  #     - "package.json"
  #     - "qodana.yaml"
  #     - ".github/workflows/qodana.yml"
  # push:
  #   branches: [main]
  #   paths:
  #     - "src/**"
  #     - "build.gradle.kts"
  #     - "settings.gradle.kts"
  #     - "gradle/**"
  #     - "docs/openapi.yaml"
  #     - "docs/overlays/**"
  #     - "package.json"
  #     - "qodana.yaml"
  #     - ".github/workflows/qodana.yml"

permissions:
  contents: read

concurrency:
  group: qodana-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    name: Qodana Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      checks: write

    env:
      GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx2g"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate OpenAPI code
        run: ./gradlew openApiGenerate --no-daemon

      - name: Run Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: |
            --linter qodana-jvm-community
            --within-docker false
            --property indexer.follows.symlinks=false
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-annotations: true
          upload-result: true
