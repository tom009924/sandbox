name: Qodana Code Quality

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Mondays at 02:00 UTC to keep PR latency low while maintaining code quality visibility
    - cron: "0 2 * * 1"

permissions:
  contents: read

concurrency:
  group: qodana-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    name: Qodana Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      checks: write

    env:
      GRADLE_OPTS: "-Dorg.gradle.parallel=true -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx2g"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate OpenAPI code
        run: ./gradlew openApiGenerate --no-daemon

      - name: Run Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          args: |
            --linter qodana-jvm-community
            --within-docker false
            --property indexer.follows.symlinks=false
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-annotations: true
          upload-result: true
