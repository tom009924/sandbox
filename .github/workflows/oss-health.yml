name: OpenSSF OSS Health & Sustainability Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-health-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard-health:
    name: OpenSSF Scorecard Health Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Evaluate OpenSSF Scorecard Health
        run: node scripts/check-oss-health.mjs
