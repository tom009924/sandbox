name: AsyncAPI Specification Validation

on:
  push:
    branches: [main]
    paths:
      - "docs/asyncapi.yaml"
      - ".github/workflows/asyncapi.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/asyncapi.yaml"
      - ".github/workflows/asyncapi.yml"

permissions:
  contents: read

concurrency:
  group: asyncapi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-asyncapi:
    name: Validate AsyncAPI Spec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate docs/asyncapi.yaml
        uses: asyncapi/cli@v6.3.1
        with:
          command: custom
          custom_command: "validate docs/asyncapi.yaml"
