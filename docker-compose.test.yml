services:
  spanner-proxy:
    build:
      context: ./services/spanner-proxy
      dockerfile: Dockerfile
    ports:
      - "9030:9030"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx96m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      SPANNER_TARGET_HOST: spanner-emulator
      SPANNER_TARGET_PORT: "9010"
      PROXY_GRPC_PORT: "9010"
      PROXY_ADMIN_PORT: "9030"
    depends_on:
      spanner-emulator:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9030/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 15

  pubsub-emulator:
    environment:
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"

  wiremock:
    environment:
      JAVA_TOOL_OPTIONS: "-Xms32m -Xmx96m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
    ports:
      - "8089:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/__admin/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15

  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx224m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      SPANNER_EMULATOR_HOST: spanner-proxy:9010
      SPANNER_DATABASE: identity-database
      SPANNER_DISABLE_BUILTIN_METRICS: "true"
      SPANNER_DISABLE_DIRECT_ACCESS_GRPC_BUILTIN_METRICS: "true"
      SPANNER_DISABLE_GRPC_GCP_OTEL_METRICS: "true"
      NOTIFICATION_EMAIL_BASE_URL: http://wiremock:8080
      NOTIFICATION_EMAIL_API_KEY: test-api-key
    depends_on:
      spanner-proxy:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  todo-service:
    build:
      context: ./services/todo-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "9092:9092"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx224m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      SPANNER_EMULATOR_HOST: spanner-proxy:9010
      SPANNER_DATABASE: todo-database
      SPANNER_DISABLE_BUILTIN_METRICS: "true"
      SPANNER_DISABLE_DIRECT_ACCESS_GRPC_BUILTIN_METRICS: "true"
      SPANNER_DISABLE_GRPC_GCP_OTEL_METRICS: "true"
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8085
      IDENTITY_SERVICE_ENABLED: "true"
      IDENTITY_SERVICE_GRPC_HOST: identity-service
      IDENTITY_SERVICE_GRPC_PORT: "9091"
      TODO_GRPC_ENABLED: "true"
      TODO_GRPC_PORT: "9092"
      NOTIFICATION_EMAIL_BASE_URL: http://wiremock:8080
      NOTIFICATION_EMAIL_API_KEY: test-api-key
    depends_on:
      spanner-proxy:
        condition: service_healthy
      pubsub-emulator:
        condition: service_started
      wiremock:
        condition: service_healthy
      identity-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      IDENTITY_GRPC_HOST: identity-service
      IDENTITY_GRPC_PORT: "9091"
      TODO_GRPC_HOST: todo-service
      TODO_GRPC_PORT: "9092"
    depends_on:
      identity-service:
        condition: service_healthy
      todo-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
