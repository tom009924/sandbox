services:
  spanner-emulator:
    image: gcr.io/cloud-spanner-emulator/emulator:latest
    ports:
      - "9010:9010"
      - "9020:9020"
  spanner-proxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-config", "/etc/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/etc/toxiproxy.json:ro
    ports:
      - "8666:8666"
      - "8474:8474"
    depends_on:
      - spanner-emulator
